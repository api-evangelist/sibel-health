  reason: customer-only-docs
  detail: 'Sibel Health runs a live AWS API Gateway at api.sibelhealth.com/jsn/alpha — the base its
    own datahub.sibelhealth.com application calls — but every path, including /openapi.json and
    /.well-known/*, returns 403 to an anonymous caller, there is no developer portal
    (developer.sibelhealth.com has a valid certificate but never answers), and the SDK that two
    August 2024 FDA clearances were granted for is released only to strategic partners, so the
    contract is reachable only with an active tenant or signed agreement.'
