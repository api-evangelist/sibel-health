aid: sibel-health
name: Sibel Health
description: 'Sibel Health, Inc. is a Chicago-based medical technology company, with an
  international office in Seoul, South Korea, that builds the FDA-cleared ANNE platform for
  continuous clinical-grade vital-sign monitoring. The platform pairs soft, flexible, rechargeable
  wearable sensors — ANNE Chest (worn at the suprasternal notch), ANNE Limb, and the ADAM sensor —
  with an ANNE Hub gateway, AI-enabled data analytics, and an integrated mobile plus cloud
  software platform. It is used across neonatal, pediatric, maternal, adult inpatient, hospital-at-home,
  remote patient monitoring, sleep diagnostic and decentralized clinical trial settings. Sibel
  operates a customer-facing cloud (per-tenant hubs such as datahub.sibelhealth.com and
  emory.hub.sibelhealth.com) backed by a live REST API at api.sibelhealth.com, and in August 2024
  received two additional FDA clearances that let ANNE Chest and ANNE Limb interoperate with
  third-party software applications through a Sibel software development kit. Neither that API nor
  that SDK is publicly documented: there is no developer portal, no published OpenAPI or other
  machine-readable contract, no public SDK package on any registry, and access is arranged through
  the company sales and partnership process.'
