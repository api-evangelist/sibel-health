apis:
- name: Sibel Health ANNE Cloud API
  description: 'The REST API behind Sibel Health''s ANNE cloud hubs. The base
    https://api.sibelhealth.com/jsn/alpha is referenced directly by the JavaScript bundle of the
    company''s own datahub.sibelhealth.com single-page application, and the host answers as an AWS
    API Gateway deployment. Every path probed anonymously returns HTTP 403 with either
    {"message":"Forbidden"} or {"message":"Missing Authentication Token"}; the CORS preflight
    advertises Authorization and X-Api-Key as accepted credential headers and
    DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT as accepted methods. No public documentation, OpenAPI
    description, or developer portal for this API could be found. Recorded here as an observed,
    customer-gated surface, not as a documented product.'
  humanURL: https://sibelhealth.com/remote-patient-monitoring/
  baseURL: https://api.sibelhealth.com/jsn/alpha
